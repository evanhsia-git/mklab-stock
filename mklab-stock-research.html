<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
<base href="/mklab-stock/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="mklab-stock — 台股/美股即時儀表板，大盤、產業、篩選、個股研究一站掌握">
<title>mklab-stock｜Research 個股研究</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<link rel="stylesheet" href="assets/css/mklab-theme.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/component.css">
<link rel="stylesheet" href="assets/css/mobile.css">
</head>
<body>
<header class="sticky-header" role="banner">
    <div id="utilbar" class="utilbar">
    <a class="brand" id="brand" href="index.html" aria-label="回首頁"></a>
    <span class="spacer"></span>
    <!-- 手機導航按鈕 - 由 CSS media query 控制顯示/隱藏 -->
    <button class="mobile-menu-btn" onclick="MKLAB.Drawer.toggle()" aria-label="開啟選單">
      <span class="hamburger">☰</span>
    </button>
  </div>
<nav id="mainNav" class="nav" aria-label="主導覽"></nav>
  <div class="freshness" aria-live="polite">資料載入中…</div>
</header>
<!-- Mobile navigation placeholder -->
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <button class="close-x" onclick="MKLAB.Drawer.close()" aria-label="關閉抽屜">×</button>
  <div class="drawer-content" id="drawerContent">
    <!-- 由 MKLAB.Drawer.init() 動態注入 drawerHTML() -->
  </div>
</aside>
<div class="drawer-mask" onclick="MKLAB.Drawer.close()" aria-hidden="true"></div>
<main class="wrap">



<div class="layout">
  <div class="panel">
    <h3>個股選擇</h3>
    <div class="row-input">
      <input id="symQ" placeholder="搜尋代號，如 2330" onkeydown="if(event.key==='Enter')searchSym()">
      <button onclick="searchSym()">搜尋</button>
    </div>
    <div class="symlist" id="symList"></div>
  </div>

  <div>
    <div class="card" id="infoCard"><p class="text-muted text-center">請選擇個股</p></div>

    <div class="card">
      <h3 id="chartTitle">大盤走勢參考（TWII 加權指數 · 近 1 年，非個股價格走勢）</h3>
      <div class="kline-toolbar">
        <button onclick="klAddIndicator('MACD')" class="btn btn-secondary btn-sm">MACD</button>
        <button onclick="klAddIndicator('KDJ')" class="btn btn-secondary btn-sm">KD</button>
        <button onclick="klClear()" class="btn btn-ghost btn-sm">清除</button>
      </div>
      <div id="tvChart" style="height:440px;"></div>
      <div id="klStats" class="muted-small-top">拖曳工具列 ▭ 圖示可框選區間查看統計</div>
    </div>

    <div class="card">
          <h3>財報摘要</h3>
          <div class="table-wrap" style="position:relative;">
            <table id="finTable"></table>
            <div id="finTablePlaceholder" class="text-muted text-center py-4" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;">
              請選擇個股以顯示財報摘要
            </div>
          </div>
        </div>
  </div>
</div>

<div class="disclaimer">僅供參考，非投資建議</div>

<script src="assets/js/data-client.js"></script>
<script src="assets/js/mklab-core.js"></script>
<script src="vendor/echarts.min.js"></script>
<script src="assets/js/mklab-chart.js"></script>
<script>
// Static fallback data
// P0-5：已移除硬編碼測試行情（原含台積電 1050、鴻海 215 等假價格），不得作為正式 fallback
const STATIC = {};

let STOCKS = {};
let finTable = null;
let currentSym = '';

function loadAll() {
  return MKLAB.data.stocks().then(d => {
    if (d && Array.isArray(d) && d.length) {
      const o = {};
      d.forEach(s => { if (s.sym) o[s.sym] = { name: s.name, price: s.price, chg: s.chg, pe: s.pe, pb: s.pb, roe: s.roe, roa: s.roa, eps: s.eps, rsi14: s.rsi14, ma5: s.ma5, ma10: s.ma10, ma20: s.ma20, ma30: s.ma30, macd_dif: s.macd_dif, macd_dea: s.macd_dea, macd_hist: s.macd_hist, kd_k: s.kd_k, kd_d: s.kd_d }; });
      STOCKS = Object.assign({}, STATIC, o);
    } else {
      STOCKS = Object.assign({}, STATIC);
    }
    renderList();
    return MKLAB.data.json('stocks');
  }).then(meta => {
    const asof = meta && meta.meta && meta.meta.as_of;
    MKLAB.setFreshness(asof);
    const q = new URLSearchParams(location.search).get('sym');
    if (q && STOCKS[q]) selectSym(q);
    else loadKLine();
  }).catch((e) => {
    STOCKS = Object.assign({}, STATIC);
    renderList();
    const box = document.getElementById('symList');
    if (box && !Object.keys(STOCKS).length) box.innerHTML = '<div class="text-muted text-sm">股票資料載入失敗，請稍後重新整理（不顯示任何替代行情）</div>';
    MKLAB.setFreshness(null);
    loadKLine();
  });
}

function searchSym() {
  const v = document.getElementById('symQ').value.trim().toUpperCase();
  if (!v) return renderList();
  const hits = Object.keys(STOCKS).filter(k => k.includes(v) || (STOCKS[k].name || '').includes(v)).slice(0, 12);
  document.getElementById('symList').innerHTML = hits.map(k => `<div data-s="${k}" onclick="selectSym('${k}')">${k} ${STOCKS[k].name || ''}</div>`).join('') || '<div class="text-muted text-sm text-center py-2">無符合代號</div>';
  if (hits.length === 1 && STOCKS[hits[0]]) selectSym(hits[0]);
}

function renderList() {
  const keys = Object.keys(STOCKS).slice(0, 20);
  document.getElementById('symList').innerHTML = keys.map(s => `<div data-s="${s}" onclick="selectSym('${s}')">${s} ${STOCKS[s].name || ''}</div>`).join('');
}

function selectSym(sym) {
  if (!STOCKS[sym]) return;
  currentSym = sym;
  document.querySelectorAll('#symList div').forEach(d => d.classList.toggle('on', d.dataset.s === sym));
  const m = STOCKS[sym];
  const chgCls = m.chg >= 0 ? 'up' : 'down', chgTxt = (m.chg > 0 ? '+' : '') + m.chg + '%';
  const kv = (k, v) => '<div><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';
  document.getElementById('infoCard').innerHTML =
    '<h3>' + sym + ' ' + m.name + ' <span class="' + chgCls + '">' + chgTxt + '</span></h3>' +
    '<div class="kv">' +
      kv('價格', m.price != null ? m.price : '-') +
      kv('PE', m.pe != null ? m.pe : '-') +
      kv('PB', m.pb != null ? m.pb : '-') +
      kv('ROE', (m.roe != null ? m.roe.toFixed(1) : '-') + '%') +
      kv('EPS', m.eps != null ? m.eps : '-') +
      kv('ROA', (m.roa != null ? m.roa.toFixed(1) : '-') + '%') +
    '</div>' +
    '<div class="kv" style="margin-top:8px;">' +
      kv('RSI(14)', m.rsi14 != null ? m.rsi14 : '-') +
      kv('MA5', m.ma5 != null ? m.ma5 : '-') +
      kv('MA20', m.ma20 != null ? m.ma20 : '-') +
      kv('MACD柱狀', m.macd_hist != null ? m.macd_hist : '-') +
      kv('KD-K', m.kd_k != null ? m.kd_k : '-') +
      kv('KD-D', m.kd_d != null ? m.kd_d : '-') +
    '</div>';
  document.getElementById('chartTitle').textContent = '大盤走勢參考（TWII 加權指數 · 近 1 年，非個股價格走勢）';
  loadKLine();
  const finRow = Object.assign({ sym: sym }, m);
  if (!finTable) {
    finTable = MKLAB.DataTable('finTable', {
      cols: ['sym', 'name', 'price', 'chg', 'pe', 'pb', 'roe', 'roa', 'eps'],
      rows: [finRow],
      pageSize: 0,
    });
  } else {
    finTable.setRows([finRow]);
  }
  // hide placeholder when table has data
  const placeholder = document.getElementById('finTablePlaceholder');
  if (placeholder) placeholder.style.display = 'none';
}

</script>
</main>
<!-- Mobile navigation placeholder -->
<footer class="footer" role="contentinfo">
  <div class="footer-inner">
    <span>mklab-stock · Web Components v2.0</span>
    <a class="link" href="https://github.com/evanhsia-git/mklab-stock" target="_blank" rel="noopener">GitHub 倉庫 ↗</a>
  </div>
</footer>

<script>
  // ===== K 線（ECharts 版，取代 lightweight-charts；KD/MACD 切換與清除按鈕皆可運作）=====
  let klInst = null;
  const klIndState = { MACD: false, KD: false };
  function klShowBrush(s) {
    const box = document.getElementById('klStats');
    if (!box) return;
    box.textContent = s
      ? `區間 ${s.from} ～ ${s.to}（${s.days} 日）｜漲跌 ${s.change > 0 ? '+' : ''}${s.change}%｜最高 ${s.high}｜最低 ${s.low}`
      : '拖曳工具列 ▭ 圖示可框選區間查看統計';
  }
  function loadKLine() {
    const raw = window.TWII_KDATA;
    const el = document.getElementById('tvChart');
    if (!el) return;
    if (!raw || !raw.length) { el.textContent = '資料載入中…'; return; }
    if (klInst) { klInst.dispose(); klInst = null; }
    el.innerHTML = '';
    klInst = MKLAB.chart.createKline(el, raw, { indicators: klIndState, onBrush: klShowBrush });
  }
  function klAddIndicator(name) {
    const key = name === 'KDJ' ? 'KD' : name;
    klIndState[key] = true;
    if (klInst) klInst.setIndicator(key, true);
  }
  function klClear() {
    klIndState.KD = false; klIndState.MACD = false;
    if (klInst) klInst.clearIndicators();
  }
</script>
<script>
  // 啟動流程（原本遺失，導致導覽列、個股清單、資料日期與個股資訊都不顯示）
  window.addEventListener('DOMContentLoaded', function () {
    MKLAB.initDrawer();
    MKLAB.Shell.mount({ active: 'research' });
    loadAll();
  });
</script>
<script>
  // 原本從未載入 twii_kdata.js，導致 K 線與 KD/MACD 按鈕都沒有資料可用；這裡在頁面就緒後先載入再繪圖
  window.addEventListener('DOMContentLoaded', function () {
    MKLAB.data.jsData('twii_kdata.js', 'TWII_KDATA')
      .then(function () { loadKLine(); })
      .catch(function (e) { console.warn('[research] K 線資料載入失敗:', e); });
  });
</script>
</body>
</html>

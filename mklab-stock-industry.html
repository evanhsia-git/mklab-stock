<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
<base href="/mklab-stock/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="mklab-stock — 台股/美股即時儀表板，大盤、產業、篩選、個股研究一站掌握">
<title>mklab-stock</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">

<body>
<header class="sticky-header" role="banner">
    <div id="utilbar" class="utilbar">
    <a class="brand" id="brand" href="index.html" aria-label="回首頁"></a>
    <span class="spacer"></span>
    <!-- 手機導航按鈕 - 由 CSS media query 控制顯示/隱藏 -->
    <button class="mobile-menu-btn" onclick="MKLAB.Drawer.toggle()" aria-label="開啟選單">
      <span class="hamburger">☰</span>
    </button>
  </div>
<nav id="mainNav" class="nav" aria-label="主導覽"></nav>
  <div class="freshness" aria-live="polite">資料載入中…</div>
</header>
<!-- Mobile navigation placeholder -->
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <button class="close-x" onclick="MKLAB.Drawer.close()" aria-label="關閉抽屜">×</button>
  <div class="drawer-content" id="drawerContent">
    <!-- 由 MKLAB.Drawer.init() 動態注入 drawerHTML() -->
  </div>
</aside>
<div class="drawer-mask" onclick="MKLAB.Drawer.close()" aria-hidden="true"></div>
<main class="wrap">



<div class="section-title">今日市場寬度</div>
<div class="breadth-summary" id="breadthSummary"></div>

<div class="section-title">漲跌幅分布</div>
<div class="card" id="histWrap"></div>

<div class="section-title">各產業上漲家數比排行</div>
<div class="table-wrap"><table id="indBreadthTable"></table></div>
<p class="muted-small-top">目前僅計算「當日」漲跌分布，52 週創高/創低家數需要後端先預先計算，暫不提供。</p>

<div class="section-title">台灣 33 產業動態（漲跌績效 · 點擊產業看成分股）</div>
<div class="grid" id="igrid"></div>

<div class="section-title">產業輪動熱力圖（點擊格子可切換選取的產業）</div>
<div class="table-wrap" style="overflow-x:auto;">
  <table id="heatmap" class="heatmap-table"></table>
</div>

<div class="section-title">全產業列表（區間績效 %）</div>
<div class="table-wrap">
  <table id="indPerfTable"></table>
</div>
<div class="pager" id="indPerfPager"></div>

<div class="section-title" id="detailTitle" style="display:none;"></div>
<div class="table-wrap" id="detailWrap" style="display:none;">
  <table id="indDetailTable"></table>
</div>
<div class="pager" id="indDetailPager"></div>

<div class="disclaimer">產業分類參考台灣證交所 33 個法定產業（示意資料）。生產環境由 Build-Time 計算各產業漲跌與成分股績效。</div>

<script src="assets/js/data-client.js"></script>
<script src="assets/js/mklab-core.js"></script>
<script>
  const INDUSTRIES = ["水泥工業","食品工業","塑膠工業","紡織纖維","電機機械","電器電纜","化學工業","生技醫療業","玻璃陶瓷","造紙工業","鋼鐵工業","橡膠工業","汽車工業","半導體業","電腦及週邊設備業","光電業","通訊網路業","電子零組件業","電子通路業","資訊服務業","其他電子業","建材營造","航運業","觀光餐旅","金融保險","貿易百貨","油電燃氣業","綜合","綠能環保","數位雲端","運動休閒","居家生活","其他等"];
  // ===== 市場寬度（原 mklab-stock-breadth.html，併入本頁）=====
  // 包在獨立區塊內，BUCKETS 與 render 函式不會和產業頁的變數互相覆蓋
  const BreadthPanel = (function () {
    const BUCKETS = [
      { label: '< -7%',    test: v => v < -7 },
      { label: '-7~-3%',   test: v => v >= -7 && v < -3 },
      { label: '-3~-1%',   test: v => v >= -3 && v < -1 },
      { label: '-1~0%',    test: v => v >= -1 && v < 0 },
      { label: '0~1%',     test: v => v >= 0 && v < 1 },
      { label: '1~3%',     test: v => v >= 1 && v < 3 },
      { label: '3~7%',     test: v => v >= 3 && v < 7 },
      { label: '> 7%',     test: v => v >= 7 },
    ];

    function renderSummary(stocks) {
      const up = stocks.filter(r => r.chg > 0).length;
      const down = stocks.filter(r => r.chg < 0).length;
      const flat = stocks.filter(r => r.chg === 0).length;
      const ratio = down > 0 ? (up / down).toFixed(2) : '∞';
      const cards = [
        { label: '上漲家數', val: up, cls: 'up' },
        { label: '下跌家數', val: down, cls: 'down' },
        { label: '平盤家數', val: flat, cls: '' },
        { label: '漲跌家數比', val: ratio, cls: '' },
      ];
      document.getElementById('breadthSummary').innerHTML = cards.map(c =>
        `<div class="card"><div class="card-title">${c.label}</div><div class="card-val ${c.cls}">${c.val}</div></div>`
      ).join('');
    }

    function renderHistogram(stocks) {
      const counts = BUCKETS.map(b => stocks.filter(r => r.chg != null && b.test(r.chg)).length);
      const max = Math.max(...counts, 1);
      let html = '';
      BUCKETS.forEach((b, i) => {
        const pct = (counts[i] / max * 100).toFixed(1);
        const color = b.label.startsWith('-') || b.label.startsWith('<') ? 'var(--down)' : (b.label.startsWith('>') || (!b.label.startsWith('0') && !b.label.startsWith('-')) ? 'var(--up)' : 'var(--muted)');
        html += `<div class="breadth-bar-row">
          <span class="breadth-bar-label">${b.label}</span>
          <span class="breadth-bar-track"><span class="breadth-bar-fill" style="width:${pct}%;--bar-fill:${color};"></span></span>
          <span class="breadth-bar-count">${counts[i]} 檔</span>
        </div>`;
      });
      document.getElementById('histWrap').innerHTML = html;
    }

    function renderIndBreadth(stocks) {
      const byInd = {};
      stocks.forEach(r => {
        if (!r.ind) return;
        byInd[r.ind] = byInd[r.ind] || { ind: r.ind, up: 0, total: 0 };
        byInd[r.ind].total++;
        if (r.chg > 0) byInd[r.ind].up++;
      });
      const rows = Object.values(byInd).map(d => ({ ...d, upRatio: d.total ? (d.up / d.total * 100) : 0 }));
      rows.sort((a, b) => b.upRatio - a.upRatio);
      let html = '<thead><tr><th>產業</th><th>上漲家數</th><th>總檔數</th><th>上漲比例</th></tr></thead><tbody>';
      rows.forEach(r => {
        html += `<tr><td>${r.ind}</td><td>${r.up}</td><td>${r.total}</td><td class="${r.upRatio >= 50 ? 'up' : 'down'}">${r.upRatio.toFixed(1)}%</td></tr>`;
      });
      html += '</tbody>';
      document.getElementById('indBreadthTable').innerHTML = html;
    }

    // 由產業頁的啟動流程呼叫；stocks 由同一次 MKLAB.data.stocks() 取得，不重複請求
    function render(stocks) {
      try {
        renderSummary(stocks);
        renderHistogram(stocks);
        renderIndBreadth(stocks);
      } catch (e) {
        console.warn('[industry/breadth] render failed:', e);
        const el = document.getElementById('breadthSummary');
        if (el) el.innerHTML = '<p class="muted-small-top">市場寬度載入失敗：' + (e && e.message ? e.message : e) + '</p>';
      }
    }
    return { render };
  })();

  // 方案 B：由 data/industry.json 載入真實值；若 y1/y5 無歷史資料顯示 '-'
  let data = [];

  let ALL_STOCKS = [];
  let stocksLoaded = false;

  function fmtPct(v) { return (v == null || typeof v === 'undefined' || Number.isNaN(v)) ? '-' : (v>0 ? '+' : '') + v.toFixed(2) + '%'; }
  function loadIndustry() {
    MKLAB.data.json('industry').then(d => {
      if (d && Array.isArray(d.industry) && d.industry.length) {
        data = d.industry.map((x, i) => ({ nm: x.nm, chg: x.chg, cnt: x.cnt, top: x.top, w1: x.w1, m1: x.m1, m3: x.m3, m6: x.m6, ytd: x.ytd, y1: x.y1, y5: x.y5 }));
        renderGrid(); renderPerf(); renderHeatmap();
        const asof = d.meta && d.meta.as_of;
        if (asof) MKLAB.setFreshness(asof);
      }
    }).catch(e => { console.warn('[industry] loadIndustry failed:', e); });

    MKLAB.data.stocks().then(d => {
      if (d && Array.isArray(d)) {
        ALL_STOCKS = d; stocksLoaded = true;
        renderGrid(); // 個股資料就緒後重新渲染卡片，補上真正的領漲/領跌
        BreadthPanel.render(d); // 市場寬度：沿用同一份個股資料，不重複請求
        if (activeInd != null) renderDetail(activeInd);
      }
    }).catch(() => {});
  }

  let activeInd = null;

  // 用產業已有的「多時間窗口報酬率」（1週/1月/3月/6月/YTD，來自 data/industry.json，
  // 跟下方「產業輪動熱力圖」同一份真實資料）畫一條簡單趨勢線，不是逐日股價走勢，
  // 但完全是真實資料，不是亂數假資料。歷史資料不足兩個有效時間窗口時顯示 '—'。
  function industrySpark(d) {
    const pts = [d.w1, d.m1, d.m3, d.m6, d.ytd].filter(v => v != null && !isNaN(v));
    if (pts.length < 2) return "<span style='opacity:0.3'>—</span>";
    const min = Math.min(...pts), max = Math.max(...pts), range = (max - min) || 1;
    const w = 100, h = 28, pad = 2;
    const coords = pts.map((v, i) => {
      const x = (i / (pts.length - 1)) * (w - pad * 2) + pad;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    const color = pts[pts.length - 1] >= pts[0] ? 'var(--up)' : 'var(--down)';
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${coords}" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`;
  }

  // 從 ALL_STOCKS（全市場個股即時資料）即時算出該產業的領漲/領跌各一檔，
  // 取代 industry.json 裡原本沒有算出數值的 top 欄位（一直是 null、沒在用）。
  function computeMovers(indName) {
    const stocks = ALL_STOCKS.filter(s => s.ind === indName && s.chg != null);
    if (!stocks.length) return null;
    const sorted = stocks.slice().sort((a, b) => b.chg - a.chg);
    return { gainer: sorted[0], loser: sorted[sorted.length - 1] };
  }

  function renderGrid() {
      document.getElementById('igrid').innerHTML = data.map((d, i) => {
        const svg = industrySpark(d);
        const movers = stocksLoaded ? computeMovers(d.nm) : null;
        const moversHtml = movers
          ? `<span class="up">▲${movers.gainer.sym} ${fmtPct(movers.gainer.chg)}</span> <span class="down">▼${movers.loser.sym} ${fmtPct(movers.loser.chg)}</span>`
          : '領漲/領跌 資料載入中…';
        return `<div class="icard ${activeInd === i ? 'on' : ''}" onclick="selInd(${i})">
          <div class="top"><span class="nm text-wrap">${d.nm}</span><span class="chg text-wrap ${d.chg >= 0 ? 'up' : 'down'}">${fmtPct(d.chg)}</span></div>
          <div class="meta text-wrap">${d.cnt} 檔</div>
          <div class="meta text-wrap" style="font-size:11px;">${moversHtml}</div>
          <div class="spark" title="近期報酬率趨勢（1週/1月/3月/6月/YTD）">${svg}</div>
        </div>`;
      }).join("");
    }

  const HEAT_COLS = [
    { key: 'w1', label: '1週' }, { key: 'm1', label: '1月' }, { key: 'm3', label: '3月' },
    { key: 'm6', label: '6月' }, { key: 'ytd', label: 'YTD' }, { key: 'y1', label: '1年' },
  ];
  let heatSortKey = null, heatSortDir = -1; // 預設不排序；-1 = 由高到低
  function heatColor(v) {
    if (v == null || isNaN(v)) return 'transparent';
    const alpha = Math.min(1, Math.abs(v) / 10).toFixed(2);
    const rgb = v >= 0 ? '220,38,38' : '22,163,74'; // 對應 --up/--down
    return `rgba(${rgb},${alpha})`;
  }
  function sortHeatmap(key) {
    if (heatSortKey === key) { heatSortDir *= -1; } else { heatSortKey = key; heatSortDir = -1; }
    renderHeatmap();
  }
  function renderHeatmap() {
    // 排序只影響「顯示用的複本」，不動原本的 data 陣列順序，
    // 避免卡片盒／全產業列表／selInd(index) 的對應關係被打亂
    const indexed = data.map((d, i) => ({ d, i }));
    if (heatSortKey) {
      indexed.sort((a, b) => {
        const va = a.d[heatSortKey], vb = b.d[heatSortKey];
        if (va == null && vb == null) return 0;
        if (va == null) return 1;
        if (vb == null) return -1;
        return (va - vb) * heatSortDir;
      });
    }
    const arrow = key => heatSortKey !== key ? '' : (heatSortDir === -1 ? ' ▼' : ' ▲');
    let html = '<thead><tr><th>產業</th>' +
      HEAT_COLS.map(c => `<th style="cursor:pointer;" onclick="sortHeatmap('${c.key}')">${c.label}${arrow(c.key)}</th>`).join('') +
      '</tr></thead><tbody>';
    indexed.forEach(({ d, i }) => {
      html += `<tr style="cursor:pointer;${activeInd === i ? 'outline:2px solid var(--accent);' : ''}" onclick="selInd(${i})"><td>${d.nm}</td>`;
      HEAT_COLS.forEach(c => {
        const v = d[c.key];
        html += `<td class="heat-cell" style="--cell-bg:${heatColor(v)}">${fmtPct(v)}</td>`;
      });
      html += '</tr>';
    });
    html += '</tbody>';
    document.getElementById('heatmap').innerHTML = html;
  }

  let perfTable = null;
  function renderPerf() {
    if (!perfTable) {
      perfTable = MKLAB.DataTable('indPerfTable', {
        cols: ['ind', 'chg', 'w1', 'm1', 'm3', 'm6', 'ytd', 'y1', 'cnt'],
        rows: data,
        pageSize: 10, pagerId: 'indPerfPager',
        fieldMap: { ind: 'nm' },
        defaultSort: 'chg',
      });
      // tbody 元素本身不會被 render() 重建（只換 innerHTML），故只需綁一次委託即可持續生效（含換頁/排序後）
      const table = document.getElementById('indPerfTable');
      if (table) {
        table.style.cursor = 'pointer';
        table.addEventListener('click', function (e) {
          const tr = e.target.closest('tr');
          if (!tr) return;
          const nm = tr.firstElementChild && tr.firstElementChild.textContent.trim();
          const idx = data.findIndex(d => d.nm === nm);
          if (idx >= 0) selInd(idx);
        });
      }
    } else {
      perfTable.setRows(data);
    }
  }

  let detailTable = null;
  function renderDetail(i) {
    const d = data[i];
    const real = ALL_STOCKS.filter(s => s.ind === d.nm);
    document.getElementById('detailTitle').style.display = 'block';
    document.getElementById('detailTitle').textContent = stocksLoaded
      ? `${d.nm} · 成分股績效（共 ${real.length} 檔，每頁 10 檔可翻頁）`
      : `${d.nm} · 成分股績效（資料載入中…）`;
    document.getElementById('detailWrap').style.display = 'block';
    if (!detailTable) {
      detailTable = MKLAB.DataTable('indDetailTable', {
        cols: ['sym', 'name', 'price', 'chg', 'pe', 'pb', 'roe', 'cap'],
        rows: real, pageSize: 10, pagerId: 'indDetailPager',
        defaultSort: 'chg',
        fieldMap: { cap: 'market_cap' },
      });
    } else {
      detailTable.setRows(real);
    }
  }

  function selInd(i) {
    activeInd = i; renderGrid(); renderHeatmap();
    renderDetail(i);
  }

  function openDrawer() { MKLAB.Drawer.open(); }
  function closeDrawer() { MKLAB.Drawer.close(); }

  window.addEventListener('DOMContentLoaded', function () {
    renderGrid(); renderPerf(); renderHeatmap();
    loadIndustry();
    MKLAB.initDrawer();
    MKLAB.Shell.mount({ active: 'industry' });
  });
</script>
</main>

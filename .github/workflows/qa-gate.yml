name: qa-gate

on:
  push:
    paths:
      - '**.py'
      - '**.html'
      - 'data/**'
      - 'skills/**'
      - 'assets/js/**'
      - 'assets/css/**'
      - '**.json'
      - '**.js'
      - '**.css'
      - '.github/workflows/qa-gate.yml'
  pull_request:
    paths:
      - '**.py'
      - '**.html'
      - 'data/**'
      - 'skills/**'
      - 'assets/js/**'
      - 'assets/css/**'
      - '**.json'
      - '**.js'
      - '**.css'

permissions:
  contents: read

jobs:
  qa-gate:
    runs-on: ubuntu-latest
    # 此 job 即 status check「qa-gate / qa-gate」。
    # 若要讓它真正「阻擋不合規的 push/merge」，請在分支保護規則加入此 status check：
    #   Settings → Branches → main → Require status checks to pass before merging → 勾選 "qa-gate / qa-gate"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Quality Gate
        run: python skills/qa-gate/qa_gate.py --json qa-result.json
      - name: 已知錯誤測試（資料與程式，P0-6：納入自動測試）
        run: python3 tests/test_known_errors.py
      - name: 持股單位與估值測試（P0-4）
        run: node tests/test_portfolio_units.js
      - name: 市場寬度測試（P0-5）
        run: node tests/test_breadth.js
      - name: Screener 欄位勾選器測試
        run: node tests/test_screener_cols.js
      - name: 判定結果
        run: python3 scripts/ci_qa_verdict.py qa-result.json
      - name: 上傳報告
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qa-report
          path: |
            data/qa-report.md
            qa-result.json

name: daily-update

# 併發控制分兩層，用途不同、不可互相取代：
#   1. workflow（run）層級：group: data-update，同一時間只允許一個 run，
#      新的 run 取代「等待中」的舊 run（排程重疊時希望跳過被取代的那個，故刻意保持 queue 預設值 single）。
#   2. job 層級：group: mklab-git-push，讓資料 job 依序執行、序列化 git push，避免同時推送互相衝突。
#      ⚠️ job 層級 concurrency 的 queue 預設是 single：同一個 group 只能有「1 個執行中 + 1 個 pending」，
#      新的 pending 會直接取消上一個 pending。workflow_dispatch 一次觸發全部 job 時，只有 2 個能存活，
#      其餘在 2 秒內被自己人取消（run #234 的 6 個 error 就是這個，不是真的失敗）
#      → 因此每個 job 都必須加 `queue: max`（最多 100 個排隊）。
#      注意：queue: max 不可與 cancel-in-progress: true 併用（會 validation error）。
#   3. 推送一律透過 scripts/ci_commit_push.sh（先 fetch、衝突取遠端較新版本、被插隊時重試 5 次）
#      → 因此每個 checkout 都必須 fetch-depth: 0。淺層 checkout 的歷史是斷的，
#        git merge 遠端分岔歷史會直接失敗，推送腳本救不回來。

on:
  schedule:
    - cron: "0 9 * * 1-5"    # daily：週一至週五 17:00（台灣）
    - cron: "0 10 * * 6"     # weekly-roe：每週六 18:00
    - cron: "30 9 * * 1-5"   # indices：週一至週五 17:30
    - cron: "0 22 * * 1-5"   # us-market：週一至週五 隔日 06:00
    - cron: "30 22 * * 1-5"  # global-history：週一至週五 隔日 06:30
    - cron: "45 22 2 * *"    # index-holdings：每月 2 日 隔日 06:45
    - cron: "0 10 20 * *"    # official-fundamentals：每月 20 日 18:00
    - cron: "0 10 * * 0"     # etf-meta：每週日 18:00
    - cron: "0 9 * * 1"      # etf-qa：每週一 17:00（台灣）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # 每日：收盤行情 → 本地計算（指標、K 線、產業、官方公司資訊）→ 市場摘要與 RSS
  daily:
    concurrency:
      group: mklab-git-push
      queue: max
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 抓取當日收盤（TWSE/TPEx）
        run: python skills/data/fetch_data.py daily
      - name: 快照確定性修正（單位／EPS-PE／股本缺口，冪等）
        run: python skills/data/sanitize_snapshot.py
      - name: 修復歷史快照死值列與公司行為偵測
        run: python skills/data/repair_history.py && python skills/data/detect_corporate_actions.py
      - name: 技術指標與 ETF 分類
        run: python skills/data/compute_indicators.py
      - name: 官方公司資訊（產業、上市日）
        run: python skills/data/integrate_official_company.py
      - name: 官方加值資料抓取（月營收／融資融券／營益分析／暫停交易／開休市）
        run: python skills/data/fetch_market_extras.py
      - name: 官方加值資料併入快照（冪等）
        run: python skills/data/integrate_market_extras.py
      - name: 官方公司行為預告（ETF 分割／減資 → 自動登錄 planned，不含比率）
        run: python skills/data/fetch_split_schedule.py --register
      - name: 個股 K 線檔
        run: python skills/data/build_kline.py
      - name: 產業統計
        run: python skills/data/compute_industry.py
      - name: 全市場 ETF 每日淨值／折溢價（TWSE MIS 反向 API，歷史月檔累積）
        run: python skills/data/fetch_etf_nav.py
      - name: 主動式 ETF 官方持股（13 家投信破解；單檔失敗標 stale 不中斷）
        run: python skills/data/fetch_etf_holdings_active.py
      - name: ETF 持股歷史累積（冪等，供換股比對）
        run: python skills/data/accumulate_etf_holdings_history.py
      - name: 每日市場摘要與 RSS（本地計算）
        run: python skills/data/build_digest.py
      - name: QA 閘門（提交前，錯誤即中止，不推送）
        run: bash scripts/ci_qa_gate.sh
      - name: 推送
        run: 'bash scripts/ci_commit_push.sh "data: 每日更新 $(date +%Y-%m-%d)" data/ rss.xml'

  # 每週六：補 ROE/ROA（只抓沒有官方財報的一般股票）
  weekly-roe:
    concurrency:
      group: mklab-git-push
      queue: max
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 * * 6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 安裝 yfinance
        run: pip install yfinance
      - name: 補 ROE/ROA（yfinance，每檔間隔 3 秒）
        run: python skills/data/fetch_data.py weekly
      - name: QA 閘門（提交前，錯誤即中止，不推送）
        run: bash scripts/ci_qa_gate.sh
      - name: 推送
        run: 'bash scripts/ci_commit_push.sh "data: ROE/ROA 補充 $(date +%Y-%m-%d)" data/'

  # 每日：全球指數、全球 ETF、總經指標、台股加權指數 K 線（合併原 twii-kline）
  indices:
    concurrency:
      group: mklab-git-push
      queue: max
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 9 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 安裝 yfinance
        run: pip install yfinance
      - name: 全球指數與 ETF（yfinance）
        run: python skills/data/fetch_data.py indices
      - name: 台股加權指數 K 線（yfinance ^TWII）
        run: python skills/data/fetch_data.py twii
      - name: QA 閘門（提交前，錯誤即中止，不推送）
        run: bash scripts/ci_qa_gate.sh
      - name: 推送
        run: 'bash scripts/ci_commit_push.sh "data: 全球指數／ETF／TWII K 線 $(date +%Y-%m-%d)" data/'

  # 每日：美股市值前 30 大個股、ETF 規模前 30 大
  us-market:
    concurrency:
      group: mklab-git-push
      queue: max
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 22 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 安裝 yfinance
        run: pip install yfinance
      - name: 美股個股與 ETF 前 30 大（yfinance）
        run: python skills/data/fetch_us_data.py all
      - name: 美股月／年漲跌（yfinance 調整後歷史價，失敗保留前次值）
        run: python skills/data/fetch_us_returns.py
      - name: QA 閘門（提交前，錯誤即中止，不推送）
        run: bash scripts/ci_qa_gate.sh
      - name: 推送
        run: 'bash scripts/ci_commit_push.sh "data: 美股前 30 大 $(date +%Y-%m-%d)" data/us/'

  # 每日：SEC EDGAR Company Facts（美股完整財報：Revenue、Gross Profit、Operating Income、Net Income、OCF、CapEx）
  sec-edgar:
    concurrency:
      group: mklab-git-push
      queue: max
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 22 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 安裝依賴（yfinance 供輔助、requests 已內建）
        run: pip install yfinance
      - name: 抓取 SEC EDGAR Company Facts 並更新 us-stocks.json
        run: python skills/data/fetch_sec_edgar.py
      - name: QA 閘門（提交前，錯誤即中止，不推送）
        run: bash scripts/ci_qa_gate.sh
      - name: 推送
        run: 'bash scripts/ci_commit_push.sh "data: SEC EDGAR $(date +%Y-%m-%d)" data/us/'

  # 每日：美股指數、全球指數與市場情緒的收盤，累積為月檔
  global-history:
    concurrency:
      group: mklab-git-push
      queue: max
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 22 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 安裝 yfinance
        run: pip install yfinance
      - name: 美股／全球／情緒每日收盤（yfinance）
        run: python skills/data/fetch_global_history.py
      - name: QA 閘門（提交前，錯誤即中止，不推送）
        run: bash scripts/ci_qa_gate.sh
      - name: 推送
        run: 'bash scripts/ci_commit_push.sh "data: 美股／全球月檔 $(date +%Y-%m-%d)" data/us-history-* data/global-history-*'

  # 每月 2 日：DIA、QQQ、SOXX、VOO 的替代 ETF 持股（VOO 來源失敗時用手動檔）
  index-holdings:
    concurrency:
      group: mklab-git-push
      queue: max
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '45 22 2 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 安裝解析套件
        run: pip install pandas openpyxl lxml
      - name: 四大指數替代 ETF 持股
        run: python skills/data/fetch_index_holdings.py
      - name: QA 閘門（提交前，錯誤即中止，不推送）
        run: bash scripts/ci_qa_gate.sh
      - name: 推送
        run: 'bash scripts/ci_commit_push.sh "data: 指數替代 ETF 持股 $(date +%Y-%m)" data/index-holdings/'

  # 每月 20 日：TWSE 官方財報（損益、資產負債表、股利、基金、公司基本資料）自動下載並匯入
  official-fundamentals:
    concurrency:
      group: mklab-git-push
      queue: max
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 20 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 安裝依賴（pandas/openpyxl 供國泰持股 Excel）
        run: pip install pandas openpyxl
      - name: 下載 TWSE 官方財報與公司資料
        run: python skills/data/fetch_official_fundamentals.py
      - name: 匯入財報（ROE/ROA/EPS、股利）
        run: python skills/data/import_official_fundamentals.py
      - name: 公司基本資料（產業、上市日）
        run: python skills/data/integrate_official_company.py
      - name: ETF 持股更新（國泰官方 API；失敗不擋 job）
        run: python skills/data/fetch_etf_holdings_cathay.py || echo "[warn] 國泰持股更新失敗，僅累積既有快照"
      - name: ETF 持股歷史累積（換股比對用，冪等）
        run: python skills/data/accumulate_etf_holdings_history.py
      - name: QA 閘門（提交前，錯誤即中止，不推送）
        run: bash scripts/ci_qa_gate.sh
      - name: 推送
        run: 'bash scripts/ci_commit_push.sh "data: 官方財報月更新 $(date +%Y-%m)" data/ data/raw/official/'

  # 每週日：ETF 補充資料（資產規模、受益人數、發行人、標的指數）
  #   官方自動化優先：TWSE ETF篩選器 CSV 端點 ＋ TPEx api/etfFilter；失敗才由人工 CSV 備援
  #   （Ivan 2026-11-15 決策；來源細節見 skills/data/fetch_etf_meta.py 檔頭）
  etf-meta:
    concurrency:
      group: mklab-git-push
      queue: max
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 * * 0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: ETF 補充資料（規模／受益人數，官方自動化）
        run: python skills/data/fetch_etf_meta.py
      - name: ETF 分類（讀剛更新的官方清單；新上市 ETF 才不會停在 unverified）
        run: python skills/data/classify_etf.py
      - name: 套用分類與技術指標
        run: python skills/data/compute_indicators.py
      - name: ETF 週邊整合（保管費／持股基準日／持股總數）
        run: python skills/data/integrate_etf_extras.py
      - name: QA 閘門（提交前，錯誤即中止，不推送）
        run: bash scripts/ci_qa_gate.sh
      - name: 推送
        run: 'bash scripts/ci_commit_push.sh "data: ETF 補充資料與分類 $(date +%Y-%m-%d)" data/etf-meta.json data/etf-classified.json data/stocks.json data/raw/twse_etf.csv'


  # ETF QA 自動化排程（A1）：每週一 17:00（台灣），跑 qa_phase4.py + ci_qa_gate.sh
  etf-qa:
    concurrency:
      group: mklab-git-push
      queue: max
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Phase 4 QA Automation
        run: python scripts/qa_phase4.py
      - name: QA Gate
        run: bash scripts/ci_qa_gate.sh
      - name: 推送（QA 不改資料時為 no-op；推送一律走共用腳本）
        run: 'bash scripts/ci_commit_push.sh "qa: ETF QA 自動化 $(date +%F)" data/'

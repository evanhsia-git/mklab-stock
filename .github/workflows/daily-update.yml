name: daily-update

# 2026-11-26 五組整合（Phase 5 最終版，詳見 WORKFLOW_CONSOLIDATION_ANALYSIS.md）：
#   10 個資料 job → 5 個（tw-stock／tw-etf／us-stock／us-etf／global-market）＋ retry-or-report。
#   10 條 cron → 4 條（美股早班／台股晚班／週末班／每日補跑班）。
#   腳本沿用現有；新增 scripts/update_state.py（狀態紀錄＋到期判斷＋投信持股半月制）。
#
# Phase 5 修正（Ivan 最終驗收規範）：
#   P0-1 fetch_data.py 寫 fetch-log.json 時保留 update_state 區塊（不再整份覆寫）。
#   P0-2 us-stock/us-etf 的 push 白名單明確含 data/fetch-log.json（狀態必須隨 push 進 main
#        才能跨 run 共享）；各組白名單維持最小必要，不放寬為整個 data/。
#   P0-3 record failed 條件含 cancelled（runner 取消也記失敗；資料未發布即不視為成功，
#        下個 run 由 due 判斷自癒重跑）。
#   P0-4 到期判斷改「最近有效交易日」（台股=台北曆、美股=美東曆，zoneinfo 自動夏令）——
#        不再用星期幾擋：台北週末 21:00 補跑班仍可補「美股週五／台股週五」未取得的資料；
#        國定假日/休市日白跑一次（冪等、不覆蓋有效資料），交易日恢復後自然取得。
#   P1-6 到期判斷前置（due-gate step 只用 stdlib，未到期任務不執行 pip install／爬蟲／QA／push）。
#
# 併發控制（兩層，用途不同）：
#   1. workflow 層：data-update，queue 預設 single——排程重疊時新 run 取代「等待中」的舊 run
#     （取消的是 pending，running 不受影響；被取代 run 的未完成子任務由 21:00 補跑班 due 判斷補齊）。
#   2. job 層：mklab-git-push，queue: max——所有 git push 序列化。job 從排隊獲得執行權後
#      才 checkout（拿到的是當下最新 main）→ 鎖定範圍涵蓋 checkout→讀取→更新→QA→commit→push。
#   3. 推送一律透過 scripts/ci_commit_push.sh v2.2（白名單、衝突中止、重試 5 次、ls-remote 驗證）
#      → 每個 checkout 都必須 fetch-depth: 0。
#
# force 不得繞過 QA Gate／push 白名單／衝突中止（這些在腳本層強制，與 mode 無關）；
# dry-run 跑全部到期任務＋QA（唯讀驗證）但不 commit、不 push、不 record 狀態。

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 美股早班：台北週二~六 06:30（us-stock、us-etf、global-market 歷史月檔）
    - cron: "30 9 * * 1-5"    # 台股晚班：台北一~五 17:30（tw-stock、tw-etf、global-market 指數；週一含 ETF QA）
    - cron: "30 10 * * 6,0"   # 週末班：台北週六 18:30（tw-stock ROE）／週日 18:30（tw-etf Meta）
    - cron: "0 13 * * *"      # 每日 21:00 到期補跑班：只跑「資料日期落後最近交易日／本期未完成／上次失敗」的子任務
  workflow_dispatch:
    inputs:
      group:
        description: '觸發組別'
        required: false
        default: 'all'
        type: choice
        options: [all, tw-stock, tw-etf, us-stock, us-etf, global-market]
      mode:
        description: '執行模式'
        required: false
        default: 'due-only'
        type: choice
        options: [due-only, force, retry-failed, dry-run]
      retry:
        description: 'retry-or-report 失敗重觸發旗標（=1 時不再重試，防循環）'
        required: false
        default: '0'
        type: string

permissions:
  contents: write
  actions: write

# Workflow 層併發保護（審核規範七：未完成排隊/重試/一致性測試前，不得解除既有保護）
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  # ════════════════════════════════════════════════════════════
  # tw-stock：tw-stock-daily（17:30 班）／tw-stock-roe（週六）／tw-stock-fundamentals（月 20 日起）
  # ════════════════════════════════════════════════════════════
  tw-stock:
    concurrency:
      group: mklab-git-push
      queue: max
      cancel-in-progress: false
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.group == 'all' || inputs.group == 'tw-stock'))
      || (github.event_name == 'schedule' && (github.event.schedule == '30 9 * * 1-5' || github.event.schedule == '30 10 * * 6,0' || github.event.schedule == '0 13 * * *'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 台北星期／班別／模式
        id: ctx
        run: |
          echo "dow=$(TZ=Asia/Taipei date +%u)" >> "$GITHUB_OUTPUT"
          echo "mode=${{ inputs.mode || 'scheduled' }}" >> "$GITHUB_OUTPUT"
          echo "sched=${{ github.event.schedule || 'manual' }}" >> "$GITHUB_OUTPUT"
      # ── 到期判斷（stdlib，pip 之前——未到期任務不裝套件不爬蟲）──
      - name: 到期判斷（due-gate）
        id: due
        run: |
          SCHED="${{ steps.ctx.outputs.sched }}"
          MODE="${{ steps.ctx.outputs.mode }}"
          DOW="${{ steps.ctx.outputs.dow }}"
          DUE=""
          add(){ DUE="$DUE $1"; }
          ckd(){ python scripts/update_state.py check "$1" >/dev/null 2>&1 && add "$1" || true; }
          if [[ "$SCHED" == "30 9 * * 1-5" ]]; then
            add tw-stock-daily
          elif [[ "$SCHED" == "30 10 * * 6,0" ]]; then
            [[ "$DOW" == "6" ]] && add tw-stock-roe
          elif [[ "$SCHED" == "0 13 * * *" ]]; then
            ckd tw-stock-daily; ckd tw-stock-roe; ckd tw-stock-fundamentals
          elif [[ "$MODE" == "force" || "$MODE" == "dry-run" ]]; then
            add tw-stock-daily; add tw-stock-roe; add tw-stock-fundamentals
          else  # 手動 due-only / retry-failed
            ckd tw-stock-daily; ckd tw-stock-roe; ckd tw-stock-fundamentals
          fi
          echo "RAN_TASKS=$(echo $DUE | xargs)" >> "$GITHUB_ENV"
          echo "到期子任務:${DUE:-' 無（全部 skip）'}"
      - uses: actions/setup-python@v6
        if: env.RAN_TASKS != ''
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: 安裝依賴
        if: env.RAN_TASKS != ''
        run: pip install -r requirements.txt
      # ── 子任務執行（由 due-gate 決定；此處純執行＋attempted 紀錄）──
      - name: 每日行情與指標＋市場摘要
        if: contains(env.RAN_TASKS, 'tw-stock-daily')
        run: |
          python skills/data/fetch_data.py daily
          python skills/data/sanitize_snapshot.py
          python skills/data/repair_history.py && python skills/data/detect_corporate_actions.py
          python skills/data/compute_indicators.py
          python skills/data/integrate_official_company.py
          python skills/data/fetch_market_extras.py
          python skills/data/integrate_market_extras.py
          python skills/data/fetch_split_schedule.py --register
          python skills/data/build_kline.py
          python skills/data/compute_industry.py
          python skills/data/build_digest.py
          python scripts/update_state.py record tw-stock-daily --status attempted
      - name: ROE/ROA 補充（yfinance，每檔間隔 3 秒）
        if: contains(env.RAN_TASKS, 'tw-stock-roe')
        run: |
          python skills/data/fetch_data.py weekly
          python scripts/update_state.py record tw-stock-roe --status attempted
      - name: 官方財報月更（TWSE 官方下載→匯入）
        if: contains(env.RAN_TASKS, 'tw-stock-fundamentals')
        run: |
          python skills/data/fetch_official_fundamentals.py
          python skills/data/import_official_fundamentals.py
          python skills/data/integrate_official_company.py
          python scripts/update_state.py record tw-stock-fundamentals --status attempted
      - name: QA 閘門（提交前，錯誤即中止，不推送）
        if: env.RAN_TASKS != ''
        run: python skills/qa-gate/qa_gate.py --gate
      - name: 推送
        id: push
        if: env.RAN_TASKS != '' && steps.ctx.outputs.mode != 'dry-run'
        run: 'bash scripts/ci_commit_push.sh "data: 台股更新 $(TZ=Asia/Taipei date +%Y-%m-%d)" data/ rss.xml'
      - name: 記錄成功狀態
        if: steps.push.outcome == 'success' && env.RAN_TASKS != ''
        run: |
          for t in ${{ env.RAN_TASKS }}; do python scripts/update_state.py record "$t" --status succeeded; done
      - name: 記錄失敗狀態
        if: (failure() || cancelled()) && env.RAN_TASKS != ''
        run: |
          for t in ${{ env.RAN_TASKS }}; do python scripts/update_state.py record "$t" --status failed; done

  # ════════════════════════════════════════════════════════════
  # tw-etf：tw-etf-nav（每日）／tw-etf-holdings（半月制）／tw-etf-meta（週日）／tw-etf-qa（週一）
  # ════════════════════════════════════════════════════════════
  tw-etf:
    concurrency:
      group: mklab-git-push
      queue: max
      cancel-in-progress: false
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.group == 'all' || inputs.group == 'tw-etf'))
      || (github.event_name == 'schedule' && (github.event.schedule == '30 9 * * 1-5' || github.event.schedule == '30 10 * * 6,0' || github.event.schedule == '0 13 * * *'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 台北星期／班別／模式
        id: ctx
        run: |
          echo "dow=$(TZ=Asia/Taipei date +%u)" >> "$GITHUB_OUTPUT"
          echo "mode=${{ inputs.mode || 'scheduled' }}" >> "$GITHUB_OUTPUT"
          echo "sched=${{ github.event.schedule || 'manual' }}" >> "$GITHUB_OUTPUT"
      - name: 到期判斷（due-gate）
        id: due
        run: |
          SCHED="${{ steps.ctx.outputs.sched }}"
          MODE="${{ steps.ctx.outputs.mode }}"
          DOW="${{ steps.ctx.outputs.dow }}"
          DUE=""
          add(){ DUE="$DUE $1"; }
          ckd(){ python scripts/update_state.py check "$1" >/dev/null 2>&1 && add "$1" || true; }
          if [[ "$SCHED" == "30 9 * * 1-5" ]]; then
            add tw-etf-nav; add tw-etf-holdings
            [[ "$DOW" == "1" ]] && add tw-etf-qa
          elif [[ "$SCHED" == "30 10 * * 6,0" ]]; then
            [[ "$DOW" == "7" ]] && add tw-etf-meta
          elif [[ "$SCHED" == "0 13 * * *" ]]; then
            ckd tw-etf-nav; ckd tw-etf-holdings; ckd tw-etf-meta; ckd tw-etf-qa
          elif [[ "$MODE" == "force" || "$MODE" == "dry-run" ]]; then
            add tw-etf-nav; add tw-etf-holdings; add tw-etf-meta; add tw-etf-qa
          else
            ckd tw-etf-nav; ckd tw-etf-holdings; ckd tw-etf-meta; ckd tw-etf-qa
          fi
          echo "RAN_TASKS=$(echo $DUE | xargs)" >> "$GITHUB_ENV"
          echo "到期子任務:${DUE:-' 無（全部 skip）'}"
      - uses: actions/setup-python@v6
        if: env.RAN_TASKS != ''
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: 安裝依賴
        if: env.RAN_TASKS != ''
        run: pip install -r requirements.txt
      - name: ETF 每日淨值與折溢價（TWSE MIS all_etf.txt 單一請求，與台股行情不同來源）
        if: contains(env.RAN_TASKS, 'tw-etf-nav')
        run: |
          python skills/data/fetch_etf_nav.py
          python scripts/update_state.py record tw-etf-nav --status attempted
      - name: 投信持股半月制（本期已成功來源跳過；只補失敗與未跑；全部失敗才擋 job）
        if: contains(env.RAN_TASKS, 'tw-etf-holdings')
        run: |
          EXTRA=""
          if [[ "${{ steps.ctx.outputs.mode }}" == "force" ]]; then EXTRA="--force"; fi
          if [[ "${{ steps.ctx.outputs.mode }}" == "dry-run" ]]; then EXTRA="--dry-run"; fi
          python scripts/update_state.py holdings-run $EXTRA
          HSRC=$(python -c "import json;d=json.load(open('data/fetch-log.json'));print(','.join((d.get('update_state',{}).get('tw-etf-holdings') or {}).get('failed_sources') or []))")
          python scripts/update_state.py record tw-etf-holdings --status attempted --failed-sources "$HSRC"
          python skills/data/accumulate_etf_holdings_history.py
          python scripts/verify_pcf_nav.py
      - name: ETF 補充資料與分類（規模／受益人數／分類／保管費）
        if: contains(env.RAN_TASKS, 'tw-etf-meta')
        run: |
          python skills/data/fetch_etf_meta.py
          python skills/data/classify_etf.py
          python skills/data/compute_indicators.py
          python skills/data/integrate_etf_extras.py
          python scripts/update_state.py record tw-etf-meta --status attempted
      - name: ETF QA 稽核（Phase 4，唯讀不改資料）
        if: contains(env.RAN_TASKS, 'tw-etf-qa')
        run: |
          python scripts/qa_phase4.py
          python scripts/update_state.py record tw-etf-qa --status attempted
      - name: QA 閘門（提交前，錯誤即中止，不推送）
        if: env.RAN_TASKS != ''
        run: python skills/qa-gate/qa_gate.py --gate
      - name: 推送
        id: push
        if: env.RAN_TASKS != '' && steps.ctx.outputs.mode != 'dry-run'
        run: 'bash scripts/ci_commit_push.sh "data: 台股 ETF 更新 $(TZ=Asia/Taipei date +%Y-%m-%d)" data/'
      - name: 記錄成功狀態
        if: steps.push.outcome == 'success' && env.RAN_TASKS != ''
        run: |
          for t in ${{ env.RAN_TASKS }}; do python scripts/update_state.py record "$t" --status succeeded; done
      - name: 記錄失敗狀態
        if: (failure() || cancelled()) && env.RAN_TASKS != ''
        run: |
          for t in ${{ env.RAN_TASKS }}; do python scripts/update_state.py record "$t" --status failed; done

  # ════════════════════════════════════════════════════════════
  # us-stock：us-stock-daily（stocks 子命令＋returns＋EDGAR，EDGAR 不動 us-stocks.json）
  # 推送白名單含 data/fetch-log.json（狀態隨 push 進 main，跨 run 共享）
  # ════════════════════════════════════════════════════════════
  us-stock:
    concurrency:
      group: mklab-git-push
      queue: max
      cancel-in-progress: false
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.group == 'all' || inputs.group == 'us-stock'))
      || (github.event_name == 'schedule' && (github.event.schedule == '30 22 * * 1-5' || github.event.schedule == '0 13 * * *'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 執行模式
        id: ctx
        run: |
          echo "mode=${{ inputs.mode || 'scheduled' }}" >> "$GITHUB_OUTPUT"
          echo "sched=${{ github.event.schedule || 'manual' }}" >> "$GITHUB_OUTPUT"
      - name: 到期判斷（due-gate）
        id: due
        run: |
          SCHED="${{ steps.ctx.outputs.sched }}"
          MODE="${{ steps.ctx.outputs.mode }}"
          DUE=""
          ckd(){ python scripts/update_state.py check "$1" >/dev/null 2>&1 && DUE="$DUE $1" || true; }
          if [[ "$SCHED" == "30 22 * * 1-5" ]]; then
            DUE="us-stock-daily"
          elif [[ "$SCHED" == "0 13 * * *" ]]; then
            ckd us-stock-daily
          elif [[ "$MODE" == "force" || "$MODE" == "dry-run" ]]; then
            DUE="us-stock-daily"
          else
            ckd us-stock-daily
          fi
          echo "RAN_TASKS=$(echo $DUE | xargs)" >> "$GITHUB_ENV"
          echo "到期子任務:${DUE:-' 無（全部 skip）'}"
      - uses: actions/setup-python@v6
        if: env.RAN_TASKS != ''
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: 安裝依賴
        if: env.RAN_TASKS != ''
        run: pip install -r requirements.txt
      - name: 美股個股行情與漲跌＋SEC EDGAR Company Facts
        if: contains(env.RAN_TASKS, 'us-stock-daily')
        run: |
          python skills/data/fetch_us_data.py stocks
          python skills/data/fetch_us_returns.py
          python skills/data/fetch_sec_edgar.py
          python scripts/update_state.py record us-stock-daily --status attempted
      - name: QA 閘門（提交前，錯誤即中止，不推送）
        if: env.RAN_TASKS != ''
        run: python skills/qa-gate/qa_gate.py --gate
      - name: 推送
        id: push
        if: env.RAN_TASKS != '' && steps.ctx.outputs.mode != 'dry-run'
        run: 'bash scripts/ci_commit_push.sh "data: 美股個股更新 $(TZ=Asia/Taipei date +%Y-%m-%d)" data/us/ data/fetch-log.json'
      - name: 記錄成功狀態
        if: steps.push.outcome == 'success' && env.RAN_TASKS != ''
        run: |
          for t in ${{ env.RAN_TASKS }}; do python scripts/update_state.py record "$t" --status succeeded; done
      - name: 記錄失敗狀態
        if: (failure() || cancelled()) && env.RAN_TASKS != ''
        run: |
          for t in ${{ env.RAN_TASKS }}; do python scripts/update_state.py record "$t" --status failed; done

  # ════════════════════════════════════════════════════════════
  # us-etf：us-etf-daily（etfs 子命令，與個股不同 ticker 集）／us-etf-holdings（月 2 日起）
  # 推送白名單含 data/fetch-log.json 與 data/index-holdings/
  # ════════════════════════════════════════════════════════════
  us-etf:
    concurrency:
      group: mklab-git-push
      queue: max
      cancel-in-progress: false
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.group == 'all' || inputs.group == 'us-etf'))
      || (github.event_name == 'schedule' && (github.event.schedule == '30 22 * * 1-5' || github.event.schedule == '0 13 * * *'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 執行模式
        id: ctx
        run: |
          echo "mode=${{ inputs.mode || 'scheduled' }}" >> "$GITHUB_OUTPUT"
          echo "sched=${{ github.event.schedule || 'manual' }}" >> "$GITHUB_OUTPUT"
      - name: 到期判斷（due-gate）
        id: due
        run: |
          SCHED="${{ steps.ctx.outputs.sched }}"
          MODE="${{ steps.ctx.outputs.mode }}"
          DUE=""
          ckd(){ python scripts/update_state.py check "$1" >/dev/null 2>&1 && DUE="$DUE $1" || true; }
          if [[ "$SCHED" == "30 22 * * 1-5" ]]; then
            DUE="us-etf-daily"
            ckd us-etf-holdings
          elif [[ "$SCHED" == "0 13 * * *" ]]; then
            ckd us-etf-daily; ckd us-etf-holdings
          elif [[ "$MODE" == "force" || "$MODE" == "dry-run" ]]; then
            DUE="us-etf-daily us-etf-holdings"
          else
            ckd us-etf-daily; ckd us-etf-holdings
          fi
          echo "RAN_TASKS=$(echo $DUE | xargs)" >> "$GITHUB_ENV"
          echo "到期子任務:${DUE:-' 無（全部 skip）'}"
      - uses: actions/setup-python@v6
        if: env.RAN_TASKS != ''
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: 安裝依賴
        if: env.RAN_TASKS != ''
        run: pip install -r requirements.txt
      - name: 美股 ETF 行情與規模
        if: contains(env.RAN_TASKS, 'us-etf-daily')
        run: |
          python skills/data/fetch_us_data.py etfs
          python scripts/update_state.py record us-etf-daily --status attempted
      - name: 指數替代 ETF 持股（DIA/QQQ/SOXX/VOO，每月 2 日起）
        if: contains(env.RAN_TASKS, 'us-etf-holdings')
        run: |
          python skills/data/fetch_index_holdings.py
          python scripts/update_state.py record us-etf-holdings --status attempted
      - name: QA 閘門（提交前，錯誤即中止，不推送）
        if: env.RAN_TASKS != ''
        run: python skills/qa-gate/qa_gate.py --gate
      - name: 推送
        id: push
        if: env.RAN_TASKS != '' && steps.ctx.outputs.mode != 'dry-run'
        run: 'bash scripts/ci_commit_push.sh "data: 美股 ETF 更新 $(TZ=Asia/Taipei date +%Y-%m-%d)" data/us/ data/index-holdings/ data/fetch-log.json'
      - name: 記錄成功狀態
        if: steps.push.outcome == 'success' && env.RAN_TASKS != ''
        run: |
          for t in ${{ env.RAN_TASKS }}; do python scripts/update_state.py record "$t" --status succeeded; done
      - name: 記錄失敗狀態
        if: (failure() || cancelled()) && env.RAN_TASKS != ''
        run: |
          for t in ${{ env.RAN_TASKS }}; do python scripts/update_state.py record "$t" --status failed; done

  # ════════════════════════════════════════════════════════════
  # global-market：global-indices（台股晚班）／global-history（美股早班）
  # 推送白名單：data/（含 fetch-log.json 與 indices.json/twii-long.json）＋歷史月檔
  # ════════════════════════════════════════════════════════════
  global-market:
    concurrency:
      group: mklab-git-push
      queue: max
      cancel-in-progress: false
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.group == 'all' || inputs.group == 'global-market'))
      || (github.event_name == 'schedule' && (github.event.schedule == '30 9 * * 1-5' || github.event.schedule == '30 22 * * 1-5' || github.event.schedule == '0 13 * * *'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 執行模式
        id: ctx
        run: |
          echo "mode=${{ inputs.mode || 'scheduled' }}" >> "$GITHUB_OUTPUT"
          echo "sched=${{ github.event.schedule || 'manual' }}" >> "$GITHUB_OUTPUT"
      - name: 到期判斷（due-gate）
        id: due
        run: |
          SCHED="${{ steps.ctx.outputs.sched }}"
          MODE="${{ steps.ctx.outputs.mode }}"
          DUE=""
          ckd(){ python scripts/update_state.py check "$1" >/dev/null 2>&1 && DUE="$DUE $1" || true; }
          if [[ "$SCHED" == "30 9 * * 1-5" ]]; then
            DUE="global-indices"
          elif [[ "$SCHED" == "30 22 * * 1-5" ]]; then
            DUE="global-history"
          elif [[ "$SCHED" == "0 13 * * *" ]]; then
            ckd global-indices; ckd global-history
          elif [[ "$MODE" == "force" || "$MODE" == "dry-run" ]]; then
            DUE="global-indices global-history"
          else
            ckd global-indices; ckd global-history
          fi
          echo "RAN_TASKS=$(echo $DUE | xargs)" >> "$GITHUB_ENV"
          echo "到期子任務:${DUE:-' 無（全部 skip）'}"
      - uses: actions/setup-python@v6
        if: env.RAN_TASKS != ''
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: 安裝依賴
        if: env.RAN_TASKS != ''
        run: pip install -r requirements.txt
      - name: 全球指數、ETF 與總經指標＋TWII K 線
        if: contains(env.RAN_TASKS, 'global-indices')
        run: |
          python skills/data/fetch_data.py indices
          python skills/data/fetch_data.py twii
          python scripts/update_state.py record global-indices --status attempted
      - name: 美股／全球／情緒歷史月檔
        if: contains(env.RAN_TASKS, 'global-history')
        run: |
          python skills/data/fetch_global_history.py
          python scripts/update_state.py record global-history --status attempted
      - name: QA 閘門（提交前，錯誤即中止，不推送）
        if: env.RAN_TASKS != ''
        run: python skills/qa-gate/qa_gate.py --gate
      - name: 推送
        id: push
        if: env.RAN_TASKS != '' && steps.ctx.outputs.mode != 'dry-run'
        run: 'bash scripts/ci_commit_push.sh "data: 全球市場更新 $(TZ=Asia/Taipei date +%Y-%m-%d)" data/ data/us-history-* data/global-history-*'
      - name: 記錄成功狀態
        if: steps.push.outcome == 'success' && env.RAN_TASKS != ''
        run: |
          for t in ${{ env.RAN_TASKS }}; do python scripts/update_state.py record "$t" --status succeeded; done
      - name: 記錄失敗狀態
        if: (failure() || cancelled()) && env.RAN_TASKS != ''
        run: |
          for t in ${{ env.RAN_TASKS }}; do python scripts/update_state.py record "$t" --status failed; done

  # P2 失敗班自動重試：等全部 job 結束後判定（skipped 不算 failure）。
  # 有失敗且本次不是重試（inputs.retry != '1'）→ 重觸發自身一次（retry=1 防循環）。
  # 資料類失敗（QA 擋下）重試後仍會被同一關卡擋下、同樣只重試一次，行為安全。
  # 業務結果告警由 telegram-notify 監聽器負責（本 job 不重複通知）。
  retry-or-report:
    needs: [tw-stock, tw-etf, us-stock, us-etf, global-market]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 判定失敗並決定是否自動重試
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_FLAG: ${{ github.event.inputs.retry || '0' }}
        run: |
          FAILED=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '[.jobs[] | select(.conclusion=="failure") | .name] | join(", ")')
          if [[ -z "$FAILED" ]]; then
            echo "所有 job 成功（skipped 不計為失敗），無需處理"
            exit 0
          fi
          echo "失敗 job: $FAILED"
          if [[ "$RETRY_FLAG" == "1" ]]; then
            echo "::warning::重試後仍失敗，不再自動重試（防循環）——請人工檢查 $FAILED"
            exit 0
          fi
          echo "自動重試一次（網路/暫時性錯誤多半一次即恢復；資料類失敗重試後仍會被 QA 擋下）"
          gh workflow run daily-update.yml --ref "${{ github.ref_name }}" -f retry=1
          echo "已觸發重試 run（retry=1）"

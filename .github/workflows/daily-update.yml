name: daily-update

# 這裡是「整條 workflow（run）」的層級：同時只允許一個 run，新的 run 取代等待中的舊 run
# （排程重疊時希望「跳過被取代的那個」，所以刻意保持 queue 預設值 single）
concurrency:
  group: data-update
  cancel-in-progress: false

# 下面每個 job 另有 job 級 concurrency（group: mklab-git-push），用途是序列化 git push、避免 race。
# ⚠️ 但 job 級 concurrency 的 queue 預設是 single：同一個 group 只能有「1 個執行中 + 1 個 pending」，
#    新的 pending 會直接取消上一個 pending。workflow_dispatch 一次觸發 8 個 job 時，
#    只有 2 個能存活，其餘 6 個在 2 秒內被自己人取消（run #234 的 6 個 error 就是這個，非真失敗）。
#    因此每個 job 都必須加上 `queue: max`（最多 100 個排隊），讓 sibling job 排隊而非互相取消。

on:
  schedule:
    # 台灣收盤後 17:00 = UTC 09:00（週一至週五）：抓收盤+PE/PB/殖利率
    - cron: "0 9 * * 1-5"
    # 每週六 10:00 UTC = 18:00 台灣：yfinance 補 ROE/ROA（sleep 3s 防 ban）
    - cron: "0 10 * * 6"
    # 每個工作日 UTC 09:30（台灣 17:30）：抓全球指數 + 代表 ETF 收盤/漲跌（yfinance）
    - cron: "30 9 * * 1-5"
    # 每個工作日 UTC 10:00：產生市場摘要 + RSS
    - cron: "0 10 * * 1-5"
    # 每個工作日 UTC 22:00（美股收盤後，不論冬夏令時皆已收盤完畢）：抓美股個股/ETF 前30大
    # 與台股排程完全分開的獨立時段，互不影響
    - cron: "0 22 * * 1-5"
    # 每個工作日 UTC 22:30（台灣隔日 06:30）：抓全球指數歷史（global-history job）
    # 注意：該 job 的 if 條件本來就寫了這條 cron，但沒註冊在這裡 → 永遠不會自動執行
    - cron: "30 22 * * 1-5"
    # 每個工作日 UTC 22:45（台灣隔日 06:45）：抓指數替代 ETF 持股（index-holdings job）
    # 同上：條件有寫、排程未註冊 → 只能手動觸發
    - cron: "45 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  daily:
    concurrency:
      group: mklab-git-push
      queue: max
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Fetch daily (TWSE OpenAPI, 雲端免 key)
        run: python skills/data/fetch_data.py daily
      - name: Compute technical indicators (MA/RSI/MACD/KD, 純本地計算不對外請求)
        run: python skills/data/compute_indicators.py
      - name: Integrate official company info (產業/上市日期，排除 TPEx 非 ETF)
        run: python skills/data/integrate_official_company.py
      - name: Build per-stock K-line files (data/kline)
        run: python skills/data/build_kline.py
      - name: Recompute industry aggregates (產業每日重算，不使用舊統計)
        run: python skills/data/compute_industry.py
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: 每日更新 $(date +%Y-%m-%d) [skip ci]"
            # Use merge instead of rebase to avoid conflicts on log files
            git pull --no-rebase origin main -X ours
            git push
          fi

  weekly-roe:
    concurrency:
      group: mklab-git-push
      queue: max
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 * * 6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install yfinance
        run: pip install yfinance
      - name: Fetch ROE/ROA (yfinance, 免 key, sleep 3s 防 ban)
        run: python skills/data/fetch_data.py weekly
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: 每週 ROE/ROA 更新 $(date +%Y-%m-%d) [skip ci]"
            git pull --no-rebase origin main -X ours
            git push
          fi

  indices:
    concurrency:
      group: mklab-git-push
      queue: max
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 9 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install yfinance
        run: pip install yfinance
      - name: Fetch global indices + ETFs (yfinance, 免 key)
        run: python skills/data/fetch_data.py indices
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: 全球指數/ETF 更新 $(date +%Y-%m-%d) [skip ci]"
            git pull --no-rebase origin main -X ours
            git push
          fi

  twii-kline:
    concurrency:
      group: mklab-git-push
      queue: max
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 9 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install yfinance
        run: pip install yfinance
      - name: Fetch TWII 加權指數 K 線 (yfinance ^TWII, 260 日窗口)
        run: python skills/data/fetch_data.py twii
      - name: Commit & push
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: TWII 加權指數 K 線更新 $(date +%Y-%m-%d) [skip ci]"
            # Use merge instead of rebase to avoid conflicts on log files
            git pull --no-rebase origin main -X ours
            git push
          fi
  digest:
    concurrency:
      group: mklab-git-push
      queue: max
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build digest (static, no key)
        run: python skills/data/build_digest.py
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ rss.xml
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: 每日摘要更新 $(date +%Y-%m-%d) [skip ci]"
            git pull --no-rebase origin main -X ours
            git push
          fi

  us-market:
    concurrency:
      group: mklab-git-push
      queue: max
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 22 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install yfinance
        run: pip install yfinance
      - name: Fetch US top-30 stocks & ETFs (yfinance, 免 key, 與台股資料完全獨立管理)
        run: python skills/data/fetch_us_data.py all
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/us/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: 美股市值/ETF規模前30大更新 $(date +%Y-%m-%d) [skip ci]"
            git pull --no-rebase origin main -X ours
            git push
          fi

  global-history:
    concurrency:
      group: mklab-git-push
      queue: max
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 22 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install yfinance
        run: pip install yfinance
      - name: Fetch US / global / sentiment daily closes (月檔，yfinance 備援)
        run: python skills/data/fetch_global_history.py
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/us-history-* data/global-history-*
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "data: 美股/全球月檔更新 $(date +%Y-%m-%d) [skip ci]"
            git pull --no-rebase origin main -X ours
            git push
          fi

  index-holdings:
    concurrency:
      group: mklab-git-push
      queue: max
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '45 22 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install parsers
        run: pip install pandas openpyxl
      - name: Fetch index-proxy ETF holdings (DIA/QQQ/SOXX 自動，VOO 手動備援)
        run: python skills/data/fetch_index_holdings.py
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/index-holdings/
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "data: 指數替代 ETF 持股更新 $(date +%Y-%m-%d) [skip ci]"
            git pull --no-rebase origin main -X ours
            git push
          fi

<section id="eventSection">
<div class="section-title" id="evTitle">大盤重大事件時間軸（加權指數 5 日累積漲跌 ±15%）</div>
<div class="muted-small-top" id="evNote" style="margin-bottom:8px;">以台股加權指數（TWII）收盤計算：任一交易日與 5 個交易日前收盤相比，累積漲跌達 ±15% 即列為事件；連續同方向且間隔不超過 5 日的觸發日合併為一個事件，取幅度最大的一天。</div>
<div class="card">

  <div class="muted-small-top" id="evLegend" style="margin-top:6px;"></div>
</div>

</section>

<section id="digestSection">
<div class="section-title">每日市場摘要 <a class="link rss-link" href="rss.xml">訂閱 RSS ↗</a></div>
<div id="digestList"></div>
<p class="muted-small-top" id="digestEmpty" style="display:none;">目前還沒有任何每日摘要，需等待 GitHub Actions 排程首次執行後才會有資料。</p>
<p class="muted-small-top">摘要每個交易日收盤後自動產生，僅供研究參考，非投資建議。</p>
</section>

<script src="assets/js/data-client.js"></script>
<script src="assets/js/mklab-core.js"></script>
<script>
  // ===== 大盤重大事件時間軸 =====
  // 門檻可切換（單選，預設第一項）。只用加權指數（大盤），不套用個股。
  // 三個檔位的事件密度以 1997-07 起的 TWII 長期資料實測：5日±15%→7 件、20日±20%→18 件、60日±30%→14 件。
  const EV_PRESETS = [
    { key: '5_15',  window: 5,  th: 0.15, label: '5 日 ±15%' },
    { key: '20_20', window: 20, th: 0.20, label: '20 日 ±20%' },
    { key: '60_30', window: 60, th: 0.30, label: '60 日 ±30%' },
  ];
  const EV_MERGE = 5;      // 合併間隔（交易日）：同方向且間隔 ≤ 5 日的觸發日合併為一事件（固定，不隨窗口放大，否則長窗口會把不同事件過度合併）
  const EV_FWD = 60;       // 事件後觀察期（交易日，約 3 個月，與股災後三個月漲跌的算法一致）
  const EV_PREF_KEY = 'mklab-digest-ev-preset';

  function getEvPreset() {
    try {
      const k = localStorage.getItem(EV_PREF_KEY);
      if (EV_PRESETS.some(p => p.key === k)) return k;
    } catch (e) {}
    return EV_PRESETS[0].key;
  }
  function setEvPreset(k) { try { localStorage.setItem(EV_PREF_KEY, k); } catch (e) {} }
  function presetOf(key) { return EV_PRESETS.find(p => p.key === key) || EV_PRESETS[0]; }
  // 歷史參考事件（來自 TVBS 股災後三月涨跌圖的標示日期）；僅在資料範圍內才會畫在時間軸上
  const KNOWN_EVENTS = [
    { d: '2000-04-10', name: '網路泡沫' },
    { d: '2008-05-19', name: '金融海嘯' },
    { d: '2011-07-27', name: '歐債危機' },
    { d: '2018-10-01', name: '中美貿易戰' },
    { d: '2020-03-10', name: '新冠疫情' },
    { d: '2022-03-28', name: '美元升息' },
  ];

  function digestCard(d) {
    const m = d.market;
    const arrow = m ? (m.chg_pct >= 0 ? 'up' : 'down') : '';
    return `<div class="card">
      <h3>${d.date}</h3>
      ${m ? `<div class="kv"><span>${m.name || '大盤'}</span><b class="${arrow}">${m.close} (${m.chg_pct >= 0 ? '+' : ''}${m.chg_pct}%)</b></div>` : ''}
      ${d.top_gainers && d.top_gainers.length ? `<p class="text-sm" style="margin-top:8px;"><b>漲幅前5：</b>${d.top_gainers.map(s => `${s.sym}${s.name || ''} <span class="up">+${s.chg}%</span>`).join('、')}</p>` : ''}
      ${d.top_losers && d.top_losers.length ? `<p class="text-sm"><b>跌幅前5：</b>${d.top_losers.map(s => `${s.sym}${s.name || ''} <span class="down">${s.chg}%</span>`).join('、')}</p>` : ''}
      ${d.industry_top && d.industry_top.length ? `<p class="text-sm"><b>產業領漲：</b>${d.industry_top.map(i => `${i.nm} +${i.chg}%`).join('、')}</p>` : ''}
      ${d.top_score && d.top_score.length ? `<p class="text-sm"><b>綜合評分 TOP5：</b>${d.top_score.slice(0, 5).map(s => `${s.sym}${s.name || ''}(${s.score})`).join('、')}</p>` : ''}
    </div>`;
  }

  // 取得大盤收盤序列：優先 data/twii-long.json（由 skills/data/fetch_twii_long.py 產生的長期資料），否則用近期的 twii_kdata.js
  // 只抓一次並快取（切換門檻檔位時重繪，不重複下載）
  let _twiiPromise = null;
  function loadTwiiSeries() {
    if (!_twiiPromise) _twiiPromise = _loadTwiiSeries();
    return _twiiPromise;
  }
  async function _loadTwiiSeries() {
    let rows = [];
    let source = '';
    const long = await MKLAB.data.json('twii-long').catch(() => null);
    if (long && Array.isArray(long.rows) && long.rows.length) {
      rows = long.rows.map(x => ({ d: String(x[0]), c: Number(x[4]) })).filter(x => isFinite(x.c));
      source = '長期資料 data/twii-long.json（' + rows[0].d + ' ～ ' + rows[rows.length - 1].d + '）';
    }
    const kd = await MKLAB.data.jsData('twii_kdata.js', 'TWII_KDATA').catch(() => null);
    if (kd && kd.length && (!rows.length || kd[0].time < rows[rows.length - 1].d)) {
      // 近期資料併入（以日期去重，近期資料優先）
      const map = new Map(rows.map(r => [r.d, r]));
      kd.forEach(k => map.set(String(k.time), { d: String(k.time), c: Number(k.close) }));
      rows = Array.from(map.values()).sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0);
      if (!source) source = '近期資料 data/twii_kdata.js（' + rows[0].d + ' ～ ' + rows[rows.length - 1].d + '）';
    }
    return { rows: rows.filter(r => r.c > 0), source: source };
  }

  // 偵測事件：win 日累積漲跌 ≥ 門檻；同方向且間隔 ≤ EV_MERGE 日的觸發合併為一個事件，取幅度最大者
  function detectEvents(rows, win, th) {
    const raw = [];
    for (let i = win; i < rows.length; i++) {
      const p = rows[i].c / rows[i - win].c - 1;
      if (Math.abs(p) >= th) raw.push({ i: i, p: p });
    }
    const out = [];
    raw.forEach(e => {
      const last = out[out.length - 1];
      if (last && e.i - last.end <= EV_MERGE && Math.sign(e.p) === Math.sign(last.p)) {
        last.end = e.i;
        if (Math.abs(e.p) > Math.abs(last.p)) { last.i = e.i; last.p = e.p; }
      } else {
        out.push({ i: e.i, end: e.i, p: e.p });
      }
    });
    return out.map(ev => {
      const r = rows[ev.i];
      const fwdIdx = ev.i + EV_FWD;
      return {
        date: r.d,
        from: rows[ev.i - win].d,
        pct: ev.p * 100,
        type: ev.p > 0 ? 'up' : 'down',
        close: r.c,
        fwd: fwdIdx < rows.length ? (rows[fwdIdx].c / r.c - 1) * 100 : null,
      };
    });
  }

  function fmtPct(v) { return v == null ? '-' : (v > 0 ? '+' : '') + v.toFixed(2) + '%'; }

  // 時間軸（水平線 + 事件點；上下交錯標註，避免重疊）
  function drawTimeline(rows, events, known) {
    const box = document.getElementById('evTimeline');
    if (!rows.length) { box.innerHTML = '<p class="text-muted">尚無大盤資料</p>'; return; }
    const W = 2400, H = 330, X0 = 60, X1 = 2340, AXIS_Y = 160;   // 加寬加高（2026-11-11）：事件密集時才有空間分層
    const t0 = Date.parse(rows[0].d), t1 = Date.parse(rows[rows.length - 1].d);
    const xOf = d => X0 + (Date.parse(d) - t0) / Math.max(1, t1 - t0) * (X1 - X0);
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="min-width:2400px;display:block;" role="img" aria-label="大盤重大事件時間軸">`;
    svg += `<line x1="${X0}" y1="${AXIS_Y}" x2="${X1}" y2="${AXIS_Y}" style="stroke:var(--border);stroke-width:3"/>`;
    // 年份刻度
    const startY = Number(rows[0].d.slice(0, 4)), endY = Number(rows[rows.length - 1].d.slice(0, 4));
    // 年份標籤密度控制（2026-11-11 修）：TWII 資料自 1997 起共 30 年，若每年都標字，
    // 在 900px 內每 15px 就一個標籤（字寬約 30px）→ 年份文字互相重疊成一團。
    // 現在：刻度照畫，但文字間距不足時只畫刻度不標字。
    const YEAR_MIN_GAP = 46;
    let lastYearX = -1e9;
    for (let y = startY; y <= endY; y++) {
      const d = y + '-01-01';
      const x = Date.parse(d) < t0 ? X0 : xOf(d);
      if (x < X0 - 1 || x > X1 + 1) continue;
      svg += `<line x1="${x}" y1="${AXIS_Y - 5}" x2="${x}" y2="${AXIS_Y + 5}" style="stroke:var(--muted)"/>`;
      if (x - lastYearX >= YEAR_MIN_GAP) {
        svg += `<text x="${x}" y="${AXIS_Y + 20}" text-anchor="middle" style="fill:var(--muted);font-size:12px">${y}</text>`;
        lastYearX = x;
      }
    }
    const marks = [];
    known.forEach(k => { if (Date.parse(k.d) >= t0 && Date.parse(k.d) <= t1) marks.push({ x: xOf(k.d), d: k.d, label: k.name, color: 'var(--muted)', sub: '歷史參考' }); });
    events.forEach(e => marks.push({ x: xOf(e.date), d: e.date, label: (e.pct > 0 ? '+' : '') + e.pct.toFixed(1) + '%', color: e.type === 'up' ? 'var(--up)' : 'var(--down)', sub: e.date }));
    marks.sort((a, b) => a.x - b.x);
    // 標註分層（2026-11-11 修：使用者回報「全部歷史事件文字重疊在一起」）。
    // 舊版只有上下 2 層（i%2），事件密集時同一層的標籤會互相蓋住。
    // 現在同側各 3 層，並用「估算標籤寬度 + 最小間距」做貪婪分層，確保同層標籤不重疊。
    // 8 層、層距 32px（主標籤+副標合計約 32px 高，層距小於它會讓相鄰層互相壓到）
    const LANE_Y = [128, 96, 64, 32, 204, 236, 268, 300];
    const MIN_PAD = 8;                          // 同層兩個標籤之間的最小水平留白（px）
    const laneLast = LANE_Y.map(() => null);    // 每層記錄最後一個標籤的 {x, hw}
    marks.forEach((m) => {
      // 估半寬要取「主標籤」與「副標（日期／歷史參考）」較寬的一邊——
      // 日期（如 1997-12-08，10 字元）比 +14.9% 寬，只估主標會讓副標壓到隔壁。
      const hw = Math.max(22, String(m.label).length * 6.5, String(m.sub).length * 4.6);
      let lane = -1;
      for (let L = 0; L < laneLast.length; L++) {
        const p = laneLast[L];
        if (p === null || m.x - p.x >= p.hw + hw + MIN_PAD) { lane = L; break; }
      }
      if (lane < 0) {                          // 6 層都不夠（極端密集）→ 挑「最早結束」的那層
        lane = 0;
        for (let L = 1; L < laneLast.length; L++) {
          const a = laneLast[L] ? laneLast[L].x : -1e9, b = laneLast[lane] ? laneLast[lane].x : -1e9;
          if (a < b) lane = L;
        }
      }
      laneLast[lane] = { x: m.x, hw: hw };
      const yText = LANE_Y[lane];
      const yStem = yText < AXIS_Y ? yText + 14 : yText - 14;
      svg += `<line x1="${m.x}" y1="${AXIS_Y}" x2="${m.x}" y2="${yStem}" style="stroke:${m.color};stroke-dasharray:3 3;opacity:.7"/>`;
      svg += `<circle cx="${m.x}" cy="${AXIS_Y}" r="6" style="fill:${m.color}"/>`;
      svg += `<text x="${m.x}" y="${yText - 6}" text-anchor="middle" style="fill:${m.color};font-size:12px;font-weight:700">${m.label}</text>`;
      svg += `<text x="${m.x}" y="${yText + 11}" text-anchor="middle" style="fill:var(--muted);font-size:9px">${m.sub}</text>`;
    });
    svg += '</svg>';
    box.innerHTML = '<div style="overflow-x:auto">' + svg + '</div>';
    document.getElementById('evLegend').innerHTML =
      '<span class="up">▲ 上漲事件</span>　<span class="down">▼ 下跌事件</span>　<span class="text-muted">灰色為歷史參考事件（僅在資料範圍內顯示）</span>';
  }

  function drawEventTable(events, p) {
    const box = document.getElementById('evList');
    const pct = Math.round(p.th * 100);
    const W = p.window + ' 日';
    if (!events.length) {
      box.innerHTML = `<div class="card"><p class="text-muted">資料範圍內沒有 ${W}累積漲跌 ±${pct}% 的大盤事件。</p></div>`;
      return;
    }
    const rows = events.slice().reverse().map(e => `<tr>
      <td>${e.date}</td>
      <td>${e.from} → ${e.date}</td>
      <td class="${e.type}"><b>${fmtPct(e.pct)}</b></td>
      <td>${e.close.toLocaleString()}</td>
      <td class="${e.fwd == null ? '' : (e.fwd >= 0 ? 'up' : 'down')}">${e.fwd == null ? '資料不足' : fmtPct(e.fwd)}</td>
    </tr>`).join('');
    box.innerHTML = `<div class="card"><h3>事件明細（共 ${events.length} 次，新到舊）</h3>
      <div class="table-wrap"><table><thead><tr><th>事件日</th><th>${W}區間</th><th>${W}累積漲跌</th><th>事件日收盤</th><th>事件後約 3 個月（60 交易日）</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="muted-small-top">「事件後約 3 個月」為事件日收盤至 60 個交易日後收盤的漲跌，資料不足則不顯示。僅供研究參考，非投資建議。</p></div>`;
  }

  function mountPresetBar(state) {
    const box = document.getElementById('evCtl');
    box.innerHTML = EV_PRESETS.map(p => `<button type="button" data-ev="${p.key}">${p.label}</button>`).join('');
    box.addEventListener('click', function (e) {
      const b = e.target.closest && e.target.closest('[data-ev]');
      if (!b || b.dataset.ev === state.key) return;
      state.key = b.dataset.ev;
      setEvPreset(state.key);
      renderEvents(state);
    });
  }

  async function renderEvents(state) {
    const p = presetOf(state.key);
    const pct = Math.round(p.th * 100);
    // 檔位按鈕 active 狀態
    document.querySelectorAll('#evCtl [data-ev]').forEach(function (b) {
      b.classList.toggle('on', b.dataset.ev === p.key);
    });
    // 標題與說明依當前檔位顯示（每次「重設」而非累加，避免切換後文字重複堆疊）
    document.getElementById('evTitle').textContent =
      `大盤重大事件時間軸（加權指數 ${p.window} 日累積漲跌 ±${pct}%）`;
    const note = `以台股加權指數（TWII）收盤計算：任一交易日與 ${p.window} 個交易日前收盤相比，累積漲跌達 ±${pct}% 即列為事件；連續同方向且間隔不超過 ${EV_MERGE} 日的觸發日合併為一個事件，取幅度最大的一天。`;
    try {
      const s = await loadTwiiSeries();
      if (!s.rows.length) {
        document.getElementById('evNote').textContent = note;
        document.getElementById('evTimeline').innerHTML = '<p class="text-muted">尚無大盤資料</p>';
        document.getElementById('evList').innerHTML = '';
        return;
      }
      document.getElementById('evNote').textContent = note + '　資料範圍：' + s.source + '。';
      const events = detectEvents(s.rows, p.window, p.th);
      drawTimeline(s.rows, events, KNOWN_EVENTS);
      drawEventTable(events, p);
    } catch (e) {
      console.warn('[digest] timeline failed:', e);
      document.getElementById('evNote').textContent = note;
      document.getElementById('evTimeline').innerHTML = '<p class="text-muted">時間軸資料載入失敗</p>';
    }
  }

  function initEvents() {
    const state = { key: getEvPreset() };
    mountPresetBar(state);
    renderEvents(state);
  }

  window.addEventListener('DOMContentLoaded', async function () {
    MKLAB.initDrawer();
    MKLAB.Shell.mount({ active: 'digest' });
    initEvents();
    try {
      const idx = await MKLAB.data.json('digest/index');
      const dates = (idx && idx.dates) || [];
      if (!dates.length) { document.getElementById('digestEmpty').style.display = 'block'; return; }
      const digests = await Promise.all(dates.slice(0, 14).map(d => MKLAB.data.json('digest/' + d).catch(() => null)));
      document.getElementById('digestList').innerHTML = digests.filter(Boolean).map(digestCard).join('');
      await MKLAB.loadFreshness();
    } catch (e) {
      console.warn('[digest] load failed:', e);
      document.getElementById('digestEmpty').style.display = 'block';
      MKLAB.setFreshness(null);
    }
  });
</script>
